<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kelas TI-Reg C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = { theme: { extend: { colors: { primary: '#004aad', accent: '#ff9100', darkbg: '#1e1e24' } } } }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24">

    <!-- Navbar -->
    <nav class="bg-darkbg text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="font-bold text-xl"><i class="fa-solid fa-user-shield text-accent mr-2"></i>Admin Dashboard</div>
            <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Keluar</button>
        </div>
    </nav>

    <!-- Halaman Login -->
    <div id="login-section" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg border-t-4 border-primary">
        <h2 class="text-2xl font-bold mb-2 text-center">Otorisasi Akses</h2>
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-3 border rounded focus:ring-2 focus:ring-primary outline-none mb-4">
        <button onclick="login()" class="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 rounded transition shadow-md">Buka Gembok</button>
    </div>

    <!-- Halaman Dashboard -->
    <div id="dashboard-section" class="max-w-4xl mx-auto mt-8 hidden px-4">
        
        <!-- MODULE: Manajemen Jadwal -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border-l-4 border-blue-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-primary"><i class="fa-solid fa-calendar-alt mr-2"></i>Manajemen Jadwal</h3>
            </div>

            <!-- Selector Dropdown -->
            <div class="mb-5 bg-slate-50 p-4 rounded border">
                <label class="block text-sm font-semibold mb-2 text-slate-600">Pilih Jadwal untuk Diedit, atau Tambah Baru:</label>
                <select id="j-selector" onchange="pilihJadwal()" class="w-full p-2 border rounded border-blue-300 font-medium text-blue-800 focus:ring-2 focus:ring-primary">
                    <option value="new">-- ✨ Tambah Jadwal Baru --</option>
                    <!-- List dari JS -->
                </select>
            </div>

            <!-- Form Input -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Hari</label>
                    <select id="j-hari" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                        <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Mata Kuliah</label>
                    <input type="text" id="j-matkul" placeholder="Contoh: Pemrograman Jaringan" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Dosen Pengampu</label>
                    <input type="text" id="j-dosen" placeholder="Nama Dosen" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Ruangan / Platform</label>
                    <input type="text" id="j-ruang" placeholder="Contoh: Lab Dasar / Gmeet" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Jam Mulai - Selesai</label>
                    <div class="flex items-center space-x-2">
                        <input type="time" id="j-mulai" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                        <span>-</span>
                        <input type="time" id="j-selesai" class="w-full p-2 border rounded bg-white focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Status Kelas</label>
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Offline" class="peer sr-only" checked>
                            <div class="text-center p-2 rounded border peer-checked:bg-blue-100 peer-checked:border-blue-500 peer-checked:text-blue-700 transition font-medium text-sm">Offline</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Online" class="peer sr-only">
                            <div class="text-center p-2 rounded border peer-checked:bg-orange-100 peer-checked:border-orange-500 peer-checked:text-orange-700 transition font-medium text-sm">Online</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Kosong" class="peer sr-only">
                            <div class="text-center p-2 rounded border peer-checked:bg-red-100 peer-checked:border-red-500 peer-checked:text-red-700 transition font-medium text-sm">Kosong</div>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Tombol Aksi CRUD -->
            <div class="flex space-x-3 mt-6 pt-4 border-t">
                <button id="btn-save-j" onclick="simpanKeDraftJadwal()" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2 rounded text-sm font-bold transition shadow"><i class="fa-solid fa-save mr-2"></i>Simpan ke Draft</button>
                <button id="btn-delete-j" onclick="hapusJadwal()" class="hidden bg-red-100 hover:bg-red-200 text-red-700 border border-red-300 px-5 py-2 rounded text-sm font-bold transition shadow"><i class="fa-solid fa-trash mr-2"></i>Hapus Data Ini</button>
            </div>
        </div>

        <!-- Draft Indicator -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-6 flex justify-between items-center shadow-sm">
            <div>
                <p class="font-bold text-yellow-800"><i class="fa-solid fa-file-signature mr-2"></i>Status Data</p>
                <p class="text-sm text-yellow-700" id="draft-status">Data belum dimodifikasi. Silakan ubah data, lalu tekan Simpan & Deploy.</p>
            </div>
        </div>
    </div>

    <!-- Tombol Mengambang Deploy -->
    <div id="fab-deploy" class="fixed bottom-6 right-6 hidden">
        <button onclick="simpanDanDeploy()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-6 rounded-full shadow-2xl transform hover:scale-105 transition flex items-center space-x-2">
            <i class="fa-solid fa-rocket text-xl"></i><span>SIMPAN & DEPLOY</span>
        </button>
    </div>

    <script>
        const REPO = 'FIAN245/WebKelasTIREGC';
        const FILE_PATH = 'data.json';
        
        let githubToken = localStorage.getItem('gh_token') || '';
        let currentData = {}; 
        let fileSha = '';     
        let isModified = false;

        // --- SISTEM LOGIN ---
        if (githubToken) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            fetchData();
        }

        function login() {
            const token = document.getElementById('github-token').value;
            if (!token) return Swal.fire('Error', 'Token tidak boleh kosong!', 'error');
            localStorage.setItem('gh_token', token);
            location.reload();
        }
        function logout() { localStorage.removeItem('gh_token'); location.reload(); }

        // --- FETCH DATA API ---
        async function fetchData() {
            Swal.fire({ title: 'Menyinkronkan data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${new Date().getTime()}`, {
                    headers: { 'Authorization': `token ${githubToken}` }
                });
                if (!response.ok) throw new Error('Token salah atau Repo tidak ditemukan.');
                
                const result = await response.json();
                fileSha = result.sha; 
                // Fix issue decode Base64 UTF-8
                const decodedContent = decodeURIComponent(escape(atob(result.content)));
                currentData = JSON.parse(decodedContent);
                
                renderDropdownJadwal(); // Generate list dropdown
                Swal.close();
                document.getElementById('fab-deploy').classList.remove('hidden');
            } catch (error) {
                Swal.fire('Gagal!', error.message, 'error');
            }
        }

        // --- SISTEM DROPDOWN & AUTO-FILL ---
        function renderDropdownJadwal() {
            const selector = document.getElementById('j-selector');
            selector.innerHTML = '<option value="new">-- ✨ Tambah Jadwal Baru --</option>';
            
            // Looping array jadwal dari JSON
            currentData.jadwal.forEach((item, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${item.hari} | ${item.matkul} (${item.jam})`;
                selector.appendChild(opt);
            });
            pilihJadwal(); // Reset form
        }

        function pilihJadwal() {
            const val = document.getElementById('j-selector').value;
            const btnSave = document.getElementById('btn-save-j');
            const btnDelete = document.getElementById('btn-delete-j');

            if (val === 'new') {
                // Mode Tambah Baru: Kosongkan Form
                document.getElementById('j-hari').value = 'Senin';
                document.getElementById('j-matkul').value = '';
                document.getElementById('j-dosen').value = '';
                document.getElementById('j-ruang').value = '';
                document.getElementById('j-mulai').value = '';
                document.getElementById('j-selesai').value = '';
                document.querySelector(`input[name="j-tipe"][value="Offline"]`).checked = true;
                
                btnSave.innerHTML = '<i class="fa-solid fa-plus mr-2"></i>Tambah ke Draft';
                btnDelete.classList.add('hidden'); // Sembunyikan tombol hapus
            } else {
                // Mode Edit: Isi form dengan data terpilih
                const dataEdit = currentData.jadwal[val];
                document.getElementById('j-hari').value = dataEdit.hari;
                document.getElementById('j-matkul').value = dataEdit.matkul;
                document.getElementById('j-dosen').value = dataEdit.dosen;
                document.getElementById('j-ruang').value = dataEdit.ruang;
                
                // Pisahkan string jam (contoh: "19:30 - 20:30")
                let waktu = dataEdit.jam.split(' - ');
                document.getElementById('j-mulai').value = waktu[0] ? waktu[0].trim() : '';
                document.getElementById('j-selesai').value = waktu[1] ? waktu[1].trim() : '';
                
                // Set status radio button
                const radioBtn = document.querySelector(`input[name="j-tipe"][value="${dataEdit.tipe}"]`);
                if(radioBtn) radioBtn.checked = true;

                btnSave.innerHTML = '<i class="fa-solid fa-edit mr-2"></i>Update Draft';
                btnDelete.classList.remove('hidden'); // Munculkan tombol hapus
            }
        }

        // --- SISTEM SAVE / UPDATE DRAFT ---
        function simpanKeDraftJadwal() {
            const val = document.getElementById('j-selector').value;
            const newData = {
                hari: document.getElementById('j-hari').value,
                matkul: document.getElementById('j-matkul').value,
                dosen: document.getElementById('j-dosen').value,
                jam: `${document.getElementById('j-mulai').value} - ${document.getElementById('j-selesai').value}`,
                ruang: document.getElementById('j-ruang').value,
                tipe: document.querySelector('input[name="j-tipe"]:checked').value
            };

            if (!newData.matkul || !document.getElementById('j-mulai').value) {
                return Swal.fire('Peringatan', 'Isi mata kuliah dan jam terlebih dahulu!', 'warning');
            }

            if (val === 'new') {
                currentData.jadwal.push(newData); // Tambah Baru
            } else {
                currentData.jadwal[val] = newData; // Timpa/Update Data Lama
            }

            tandaiModifikasi();
            renderDropdownJadwal(); // Refresh isi dropdown
            Swal.fire({ icon: 'success', title: 'Masuk Draf!', timer: 1500, showConfirmButton: false });
        }

        // --- SISTEM DELETE ---
        function hapusJadwal() {
            const val = document.getElementById('j-selector').value;
            if (val === 'new') return;

            Swal.fire({
                title: 'Hapus Jadwal?', text: "Data jadwal ini akan dihapus dari sistem.", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Ya, Hapus!'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentData.jadwal.splice(val, 1); // Hapus array berdasarkan index
                    tandaiModifikasi();
                    renderDropdownJadwal();
                    Swal.fire({ icon: 'success', title: 'Terhapus dari Draf', timer: 1500, showConfirmButton: false });
                }
            });
        }

        function tandaiModifikasi() {
            isModified = true;
            document.getElementById('draft-status').innerHTML = `<span class="text-red-600 font-bold">Data sudah dimodifikasi!</span> Jangan lupa klik tombol hijau "SIMPAN & DEPLOY" di pojok kanan bawah agar web kelas berubah.`;
        }

        // --- PUSH KE GITHUB & TRIGGER EDGEONE ---
        async function simpanDanDeploy() {
            if (!isModified) return Swal.fire('Info', 'Belum ada data yang diubah.', 'info');
            Swal.fire({ title: 'Menyebarkan ke CDN...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // Fix masalah karakter khusus saat di-encode ke Base64 (UTF-8 safe)
            const updatedJsonString = JSON.stringify(currentData, null, 4);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonString)));

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update Jadwal via Admin Panel", content: encodedContent, sha: fileSha })
                });

                if (response.ok) {
                    Swal.fire('Berhasil Terkirim! 🚀', 'Tunggu sekitar 15 detik agar EdgeOne selesai merakit web kelasmu.', 'success')
                    .then(() => location.reload());
                } else { throw new Error('Gagal Push.'); }
            } catch (error) { Swal.fire('Gagal Push!', error.message, 'error'); }
        }
    </script>
</body>
</html>
