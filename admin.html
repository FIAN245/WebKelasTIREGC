<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kelas TI-Reg C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = { theme: { extend: { colors: { primary: '#004aad', accent: '#ff9100', darkbg: '#1e1e24' } } } }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24">

    <!-- Navbar -->
    <nav class="bg-darkbg text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="font-bold text-xl"><i class="fa-solid fa-user-shield text-accent mr-2"></i>Admin Dashboard</div>
            <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Keluar</button>
        </div>
    </nav>

    <!-- Halaman Login -->
    <div id="login-section" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg border-t-4 border-primary">
        <h2 class="text-2xl font-bold mb-2 text-center">Otorisasi Akses</h2>
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-3 border rounded focus:ring-2 focus:ring-primary outline-none mb-4">
        <button onclick="login()" class="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 rounded transition shadow-md">Buka Gembok</button>
    </div>

    <!-- Halaman Dashboard -->
    <div id="dashboard-section" class="max-w-4xl mx-auto mt-8 hidden px-4 space-y-8">
        
        <!-- MODULE: Manajemen Jadwal -->
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
            <h3 class="text-lg font-bold text-primary mb-4"><i class="fa-solid fa-calendar-alt mr-2"></i>Manajemen Jadwal</h3>
            <select id="j-selector" onchange="pilihJadwal()" class="w-full p-2 mb-4 border rounded border-blue-300 font-medium text-blue-800 focus:ring-2 focus:ring-primary">
                <option value="new">-- ✨ Tambah Jadwal Baru --</option>
            </select>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-semibold mb-1">Hari</label><select id="j-hari" class="w-full p-2 border rounded"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option></select></div>
                <div><label class="block text-sm font-semibold mb-1">Mata Kuliah</label><input type="text" id="j-matkul" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Dosen</label><input type="text" id="j-dosen" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Ruangan/Platform</label><input type="text" id="j-ruang" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Jam (Mulai - Selesai)</label><div class="flex space-x-2"><input type="time" id="j-mulai" class="w-full p-2 border rounded"><span>-</span><input type="time" id="j-selesai" class="w-full p-2 border rounded"></div></div>
                <div><label class="block text-sm font-semibold mb-1">Status Kelas</label>
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer"><input type="radio" name="j-tipe" value="Offline" class="peer sr-only" checked><div class="text-center p-2 rounded border peer-checked:bg-blue-100 peer-checked:border-blue-500 peer-checked:text-blue-700 font-medium text-sm">Offline</div></label>
                        <label class="flex-1 cursor-pointer"><input type="radio" name="j-tipe" value="Online" class="peer sr-only"><div class="text-center p-2 rounded border peer-checked:bg-orange-100 peer-checked:border-orange-500 peer-checked:text-orange-700 font-medium text-sm">Online</div></label>
                        <label class="flex-1 cursor-pointer"><input type="radio" name="j-tipe" value="Kosong" class="peer sr-only"><div class="text-center p-2 rounded border peer-checked:bg-red-100 peer-checked:border-red-500 peer-checked:text-red-700 font-medium text-sm">Kosong</div></label>
                    </div>
                </div>
            </div>
            <div class="flex space-x-3 mt-4 pt-4 border-t">
                <button id="btn-save-j" onclick="simpanDraft('jadwal')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded text-sm font-bold shadow">Simpan Jadwal</button>
                <button id="btn-delete-j" onclick="hapusDraft('jadwal')" class="hidden bg-red-100 text-red-700 px-5 py-2 rounded text-sm font-bold">Hapus</button>
            </div>
        </div>

        <!-- MODULE: Manajemen Pengumuman -->
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
            <h3 class="text-lg font-bold text-red-600 mb-4"><i class="fa-solid fa-bullhorn mr-2"></i>Manajemen Pengumuman</h3>
            <select id="p-selector" onchange="pilihPengumuman()" class="w-full p-2 mb-4 border rounded border-red-300 font-medium text-red-800 focus:ring-2 focus:ring-red-500">
                <option value="new">-- ✨ Tambah Pengumuman Baru --</option>
            </select>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-semibold mb-1">Tanggal & Waktu</label><input type="text" id="p-tanggal" placeholder="Misal: 15 Sept 2026 - 10:00" class="w-full p-2 border rounded"></div>
                <div class="flex items-end pb-2">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="p-penting" class="w-5 h-5 text-red-600 rounded">
                        <span class="font-semibold text-red-600">Tandai PENTING (Warna Merah)</span>
                    </label>
                </div>
                <div class="md:col-span-2"><label class="block text-sm font-semibold mb-1">Isi Pengumuman</label><textarea id="p-teks" rows="3" placeholder="Tulis pengumuman di sini..." class="w-full p-2 border rounded"></textarea></div>
            </div>
            <div class="flex space-x-3 mt-4 pt-4 border-t">
                <button id="btn-save-p" onclick="simpanDraft('pengumuman')" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded text-sm font-bold shadow">Simpan Pengumuman</button>
                <button id="btn-delete-p" onclick="hapusDraft('pengumuman')" class="hidden bg-red-100 text-red-700 px-5 py-2 rounded text-sm font-bold">Hapus</button>
            </div>
        </div>

        <!-- MODULE: Manajemen Tugas -->
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
            <h3 class="text-lg font-bold text-green-600 mb-4"><i class="fa-solid fa-tasks mr-2"></i>Manajemen Tugas</h3>
            <select id="t-selector" onchange="pilihTugas()" class="w-full p-2 mb-4 border rounded border-green-300 font-medium text-green-800 focus:ring-2 focus:ring-green-500">
                <option value="new">-- ✨ Tambah Tugas Baru --</option>
            </select>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block text-sm font-semibold mb-1">Mata Kuliah</label><input type="text" id="t-matkul" placeholder="Mata Kuliah" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Judul Tugas</label><input type="text" id="t-judul" placeholder="Contoh: Makalah Kelompok 1" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Deadline</label><input type="text" id="t-deadline" placeholder="Misal: 18 September 2026" class="w-full p-2 border rounded"></div>
                <div><label class="block text-sm font-semibold mb-1">Link Pengumpulan</label><input type="text" id="t-link" placeholder="URL GDrive / Keterangan" class="w-full p-2 border rounded"></div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-1">Deskripsi & Ketentuan (Gunakan ENTER untuk membuat poin-poin baru)</label>
                    <textarea id="t-deskripsi" rows="5" placeholder="Ketentuan 1...&#10;Ketentuan 2..." class="w-full p-2 border rounded"></textarea>
                </div>
            </div>
            <div class="flex space-x-3 mt-4 pt-4 border-t">
                <button id="btn-save-t" onclick="simpanDraft('tugas')" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded text-sm font-bold shadow">Simpan Tugas</button>
                <button id="btn-delete-t" onclick="hapusDraft('tugas')" class="hidden bg-red-100 text-red-700 px-5 py-2 rounded text-sm font-bold">Hapus</button>
            </div>
        </div>

        <!-- Draft Indicator -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-6 shadow-sm">
            <p class="font-bold text-yellow-800"><i class="fa-solid fa-file-signature mr-2"></i>Status Sinkronisasi</p>
            <p class="text-sm text-yellow-700" id="draft-status">Semua data aman. Modifikasi form di atas lalu tekan Simpan & Deploy.</p>
        </div>
    </div>

    <!-- Tombol Mengambang Deploy -->
    <div id="fab-deploy" class="fixed bottom-6 right-6 hidden">
        <button onclick="simpanDanDeploy()" class="bg-slate-800 hover:bg-black text-white font-bold py-4 px-6 rounded-full shadow-2xl transform hover:scale-105 transition flex items-center space-x-2">
            <i class="fa-solid fa-rocket text-xl text-accent"></i><span>SIMPAN & DEPLOY</span>
        </button>
    </div>

    <script>
        const REPO = 'FIAN245/WebKelasTIREGC';
        const FILE_PATH = 'data.json';
        
        let githubToken = localStorage.getItem('gh_token') || '';
        let currentData = {}; 
        let fileSha = '';     
        let isModified = false;

        if (githubToken) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            fetchData();
        }

        function login() {
            const token = document.getElementById('github-token').value;
            if (!token) return Swal.fire('Error', 'Token kosong!', 'error');
            localStorage.setItem('gh_token', token);
            location.reload();
        }
        function logout() { localStorage.removeItem('gh_token'); location.reload(); }

        async function fetchData() {
            Swal.fire({ title: 'Menarik Data...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}?t=${new Date().getTime()}`, {
                    headers: { 'Authorization': `token ${githubToken}` }
                });
                if (!response.ok) throw new Error('Token salah / Repo tidak ditemukan.');
                const result = await response.json();
                fileSha = result.sha; 
                currentData = JSON.parse(decodeURIComponent(escape(atob(result.content))));
                
                renderSemuaDropdown();
                Swal.close();
                document.getElementById('fab-deploy').classList.remove('hidden');
            } catch (error) { Swal.fire('Gagal!', error.message, 'error'); }
        }

        // --- RENDER SEMUA DROPDOWN ---
        function renderSemuaDropdown() {
            // Jadwal
            const sJadwal = document.getElementById('j-selector');
            sJadwal.innerHTML = '<option value="new">-- ✨ Tambah Jadwal Baru --</option>';
            currentData.jadwal.forEach((item, idx) => sJadwal.innerHTML += `<option value="${idx}">${item.hari} | ${item.matkul} (${item.jam})</option>`);
            pilihJadwal();

            // Pengumuman
            const sPengumuman = document.getElementById('p-selector');
            sPengumuman.innerHTML = '<option value="new">-- ✨ Tambah Pengumuman Baru --</option>';
            currentData.pengumuman.forEach((item, idx) => sPengumuman.innerHTML += `<option value="${idx}">[${item.tanggal}] ${String(item.text).substring(0,30)}...</option>`);
            pilihPengumuman();

            // Tugas
            const sTugas = document.getElementById('t-selector');
            sTugas.innerHTML = '<option value="new">-- ✨ Tambah Tugas Baru --</option>';
            currentData.tugas.forEach((item, idx) => sTugas.innerHTML += `<option value="${idx}">${item.matkul} - ${item.judul}</option>`);
            pilihTugas();
        }

        // --- FUNGSI AUTO-FILL SAAT DROPDOWN DIPILIH ---
        function pilihJadwal() {
            const val = document.getElementById('j-selector').value;
            if(val === 'new') {
                document.getElementById('j-matkul').value = ''; document.getElementById('j-dosen').value = '';
                document.getElementById('j-mulai').value = ''; document.getElementById('j-selesai').value = '';
                document.getElementById('btn-save-j').innerText = "Tambah Jadwal Baru";
                document.getElementById('btn-delete-j').classList.add('hidden');
            } else {
                const data = currentData.jadwal[val];
                document.getElementById('j-hari').value = data.hari; document.getElementById('j-matkul').value = data.matkul;
                document.getElementById('j-dosen').value = data.dosen; document.getElementById('j-ruang').value = data.ruang;
                let waktu = data.jam.split(' - ');
                document.getElementById('j-mulai').value = waktu[0] || ''; document.getElementById('j-selesai').value = waktu[1] || '';
                document.querySelector(`input[name="j-tipe"][value="${data.tipe}"]`).checked = true;
                document.getElementById('btn-save-j').innerText = "Update Jadwal";
                document.getElementById('btn-delete-j').classList.remove('hidden');
            }
        }

        function pilihPengumuman() {
            const val = document.getElementById('p-selector').value;
            if(val === 'new') {
                document.getElementById('p-tanggal').value = ''; document.getElementById('p-teks').value = '';
                document.getElementById('p-penting').checked = false;
                document.getElementById('btn-save-p').innerText = "Tambah Pengumuman"; document.getElementById('btn-delete-p').classList.add('hidden');
            } else {
                const data = currentData.pengumuman[val];
                document.getElementById('p-tanggal').value = data.tanggal; 
                document.getElementById('p-teks').value = Array.isArray(data.text) ? data.text.join('\n') : data.text;
                document.getElementById('p-penting').checked = data.penting;
                document.getElementById('btn-save-p').innerText = "Update Pengumuman"; document.getElementById('btn-delete-p').classList.remove('hidden');
            }
        }

        function pilihTugas() {
            const val = document.getElementById('t-selector').value;
            if(val === 'new') {
                document.getElementById('t-matkul').value = ''; document.getElementById('t-judul').value = '';
                document.getElementById('t-deadline').value = ''; document.getElementById('t-link').value = '';
                document.getElementById('t-deskripsi').value = '';
                document.getElementById('btn-save-t').innerText = "Tambah Tugas"; document.getElementById('btn-delete-t').classList.add('hidden');
            } else {
                const data = currentData.tugas[val];
                document.getElementById('t-matkul').value = data.matkul; document.getElementById('t-judul').value = data.judul;
                document.getElementById('t-deadline').value = data.deadline; document.getElementById('t-link').value = data.link_pengumpulan;
                // Gabungkan array deskripsi dengan Enter agar mudah diedit
                document.getElementById('t-deskripsi').value = Array.isArray(data.deskripsi) ? data.deskripsi.join('\n') : data.deskripsi;
                document.getElementById('btn-save-t').innerText = "Update Tugas"; document.getElementById('btn-delete-t').classList.remove('hidden');
            }
        }

        // --- SISTEM CRUD ARRAY ---
        function simpanDraft(tipe) {
            let newData = {};
            let val = document.getElementById(`${tipe.charAt(0)}-selector`).value; // j-selector / p-selector / t-selector

            if(tipe === 'jadwal') {
                newData = {
                    hari: document.getElementById('j-hari').value, matkul: document.getElementById('j-matkul').value,
                    dosen: document.getElementById('j-dosen').value, jam: `${document.getElementById('j-mulai').value} - ${document.getElementById('j-selesai').value}`,
                    ruang: document.getElementById('j-ruang').value, tipe: document.querySelector('input[name="j-tipe"]:checked').value
                };
            } else if(tipe === 'pengumuman') {
                // Teks pengumuman dipecah berdasar enter
                const textRaw = document.getElementById('p-teks').value;
                newData = {
                    id: Date.now(), tanggal: document.getElementById('p-tanggal').value,
                    text: textRaw.includes('\n') ? textRaw.split('\n').filter(t => t.trim()) : textRaw,
                    penting: document.getElementById('p-penting').checked
                };
            } else if(tipe === 'tugas') {
                // Teks deskripsi tugas dipecah menjadi array berdasarkan Enter
                const descLines = document.getElementById('t-deskripsi').value.split('\n').filter(line => line.trim() !== '');
                newData = {
                    id: Date.now(), matkul: document.getElementById('t-matkul').value, judul: document.getElementById('t-judul').value,
                    deadline: document.getElementById('t-deadline').value, deskripsi: descLines,
                    link_pengumpulan: document.getElementById('t-link').value
                };
            }

            if(val === 'new') currentData[tipe].push(newData);
            else currentData[tipe][val] = newData;

            tandaiModifikasi();
            renderSemuaDropdown();
            Swal.fire({ icon: 'success', title: 'Tersimpan di Draft Lokal!', showConfirmButton: false, timer: 1200 });
        }

        function hapusDraft(tipe) {
            const val = document.getElementById(`${tipe.charAt(0)}-selector`).value;
            if (val === 'new') return;
            Swal.fire({ title: 'Hapus Data?', text: "Data akan dihapus.", icon: 'warning', showCancelButton: true, confirmButtonText: 'Hapus!'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentData[tipe].splice(val, 1);
                    tandaiModifikasi();
                    renderSemuaDropdown();
                }
            });
        }

        function tandaiModifikasi() {
            isModified = true;
            document.getElementById('draft-status').innerHTML = `<span class="text-red-600 font-bold">Terjadi Perubahan!</span> Tekan SIMPAN & DEPLOY untuk meluncurkan ke publik.`;
        }

        // --- PUSH KE GITHUB ---
        async function simpanDanDeploy() {
            if (!isModified) return Swal.fire('Info', 'Belum ada data yang diubah.', 'info');
            Swal.fire({ title: 'Menyebarkan ke CDN...', text: 'Mengunci data JSON ke repositori...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            const encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 4))));
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update Data Keseluruhan via Admin Panel", content: encodedContent, sha: fileSha })
                });
                if (response.ok) {
                    Swal.fire('Berhasil Terkirim! 🚀', 'Situs kamu akan terupdate dalam belasan detik.', 'success').then(() => location.reload());
                } else throw new Error('Gagal Push.');
            } catch (error) { Swal.fire('Gagal Push!', error.message, 'error'); }
        }
    </script>
</body>
</html>
