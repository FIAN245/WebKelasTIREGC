<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kelas TI-Reg C</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 untuk Pop-up interaktif -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
      tailwind.config = {
        theme: {
          extend: { colors: { primary: '#004aad', accent: '#ff9100', darkbg: '#1e1e24' } }
        }
      }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased pb-24">

    <!-- Navbar Khusus Admin -->
    <nav class="bg-darkbg text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="font-bold text-xl"><i class="fa-solid fa-user-shield text-accent mr-2"></i>Admin Dashboard</div>
            <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Keluar</button>
        </div>
    </nav>

    <!-- Halaman Login Token (Muncul jika belum ada token) -->
    <div id="login-section" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg border-t-4 border-primary">
        <h2 class="text-2xl font-bold mb-2 text-center">Otorisasi Akses</h2>
        <p class="text-sm text-slate-500 mb-6 text-center">Masukkan GitHub Personal Access Token (PAT) kamu.</p>
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" class="w-full p-3 border rounded focus:ring-2 focus:ring-primary outline-none mb-4">
        <button onclick="login()" class="w-full bg-primary hover:bg-blue-800 text-white font-bold py-3 rounded transition shadow-md">Buka Gembok</button>
    </div>

    <!-- Halaman Dashboard (Muncul setelah login) -->
    <div id="dashboard-section" class="max-w-4xl mx-auto mt-8 hidden px-4">
        
        <!-- Form Tambah Jadwal -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6 border-l-4 border-blue-500">
            <h3 class="text-lg font-bold mb-4 text-primary"><i class="fa-solid fa-calendar-plus mr-2"></i>Update Jadwal Perkuliahan</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Hari</label>
                    <select id="j-hari" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                        <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Mata Kuliah</label>
                    <input type="text" id="j-matkul" placeholder="Contoh: Pemrograman Jaringan" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Dosen Pengampu</label>
                    <input type="text" id="j-dosen" placeholder="Nama Dosen" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Ruangan / Platform</label>
                    <input type="text" id="j-ruang" placeholder="Contoh: Lab Dasar / Gmeet" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                </div>
                <!-- Input Waktu (Spin Waktu Bawaan Browser) -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Jam Mulai - Selesai</label>
                    <div class="flex items-center space-x-2">
                        <input type="time" id="j-mulai" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                        <span>-</span>
                        <input type="time" id="j-selesai" class="w-full p-2 border rounded bg-slate-50 focus:ring-2 focus:ring-primary">
                    </div>
                </div>
                <!-- Tipe Kelas (Radio Button ala Toggle Interaktif) -->
                <div>
                    <label class="block text-sm font-semibold mb-1">Status Kelas</label>
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Offline" class="peer sr-only" checked>
                            <div class="text-center p-2 rounded border peer-checked:bg-blue-100 peer-checked:border-blue-500 peer-checked:text-blue-700 peer-hover:bg-slate-100 transition font-medium text-sm">Offline</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Online" class="peer sr-only">
                            <div class="text-center p-2 rounded border peer-checked:bg-orange-100 peer-checked:border-orange-500 peer-checked:text-orange-700 peer-hover:bg-slate-100 transition font-medium text-sm">Online</div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="j-tipe" value="Kosong" class="peer sr-only">
                            <div class="text-center p-2 rounded border peer-checked:bg-red-100 peer-checked:border-red-500 peer-checked:text-red-700 peer-hover:bg-slate-100 transition font-medium text-sm">Kosong</div>
                        </label>
                    </div>
                </div>
            </div>
            <button onclick="tambahJadwal()" class="mt-4 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded text-sm font-medium transition shadow"><i class="fa-solid fa-plus mr-2"></i>Tumpuk ke Draft Jadwal</button>
        </div>

        <!-- Draft Indicator -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded mb-6 flex justify-between items-center shadow-sm">
            <div>
                <p class="font-bold text-yellow-800"><i class="fa-solid fa-file-signature mr-2"></i>Status Data</p>
                <p class="text-sm text-yellow-700" id="draft-status">Data belum dimodifikasi. Silakan ubah data, lalu tekan Simpan & Deploy.</p>
            </div>
        </div>

    </div>

    <!-- Tombol Mengambang (Floating Action Button) untuk Deploy -->
    <div id="fab-deploy" class="fixed bottom-6 right-6 hidden">
        <button onclick="simpanDanDeploy()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-6 rounded-full shadow-2xl transform hover:scale-105 transition flex items-center space-x-2">
            <i class="fa-solid fa-rocket text-xl"></i>
            <span>SIMPAN & DEPLOY</span>
        </button>
    </div>

    <!-- LOGIKANYA DI SINI -->
    <script>
        const REPO = 'FIAN245/WebKelasTIREGC';
        const FILE_PATH = 'data.json';
        
        let githubToken = localStorage.getItem('gh_token') || '';
        let currentData = {}; // Menyimpan data.json asli
        let fileSha = '';     // Diperlukan GitHub untuk menimpa file
        let isModified = false;

        // Cek login saat web dibuka
        if (githubToken) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            fetchData(); // Langsung tarik data dari GitHub
        }

        function login() {
            const token = document.getElementById('github-token').value;
            if (!token) return Swal.fire('Error', 'Token tidak boleh kosong!', 'error');
            localStorage.setItem('gh_token', token);
            githubToken = token;
            location.reload();
        }

        function logout() {
            localStorage.removeItem('gh_token');
            location.reload();
        }

        // 1. Fungsi Tarik Data dari GitHub
        async function fetchData() {
            Swal.fire({ title: 'Menyinkronkan data...', text: 'Mengambil data dari GitHub.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    headers: { 'Authorization': `token ${githubToken}` }
                });
                
                if (!response.ok) throw new Error('Token salah atau Repo tidak ditemukan.');
                
                const result = await response.json();
                fileSha = result.sha; // Simpan SHA untuk update
                
                // Decode konten Base64 dari GitHub
                const decodedContent = decodeURIComponent(escape(atob(result.content)));
                currentData = JSON.parse(decodedContent);
                
                Swal.close();
                document.getElementById('fab-deploy').classList.remove('hidden');
            } catch (error) {
                Swal.fire('Gagal!', error.message, 'error');
                logout(); // Hapus token jika gagal
            }
        }

        // 2. Fungsi Menambah Jadwal ke Draft Memory
        function tambahJadwal() {
            const jadwalBaru = {
                hari: document.getElementById('j-hari').value,
                matkul: document.getElementById('j-matkul').value,
                dosen: document.getElementById('j-dosen').value,
                jam: `${document.getElementById('j-mulai').value} - ${document.getElementById('j-selesai').value}`,
                ruang: document.getElementById('j-ruang').value,
                tipe: document.querySelector('input[name="j-tipe"]:checked').value
            };

            if (!jadwalBaru.matkul || !document.getElementById('j-mulai').value) {
                return Swal.fire('Peringatan', 'Isi mata kuliah dan jam terlebih dahulu!', 'warning');
            }

            // Tambahkan ke Array Jadwal (bisa juga fitur replace/update)
            currentData.jadwal.push(jadwalBaru);
            isModified = true;
            document.getElementById('draft-status').innerText = `Ada 1 pembaruan di draf. Jangan lupa klik SIMPAN & DEPLOY!`;
            
            Swal.fire({ icon: 'success', title: 'Masuk Draf!', text: 'Jadwal berhasil ditambahkan ke memori. Tekan tombol hijau di pojok untuk mengudara.', timer: 2000, showConfirmButton: false });
        }

        // 3. Fungsi Puncak: Push API ke GitHub (Otomatis Trigger EdgeOne)
        async function simpanDanDeploy() {
            if (!isModified) return Swal.fire('Info', 'Belum ada data yang diubah.', 'info');

            Swal.fire({ title: 'Menyebarkan ke CDN...', html: 'Mengirim data ke GitHub.<br>EdgeOne Makers akan men-deploy ulang secara otomatis.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // Encode kembali ke Base64 (Syarat GitHub API)
            const updatedJsonString = JSON.stringify(currentData, null, 4);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJsonString)));

            const commitData = {
                message: "Update data via Admin Panel",
                content: encodedContent,
                sha: fileSha
            };

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${githubToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(commitData)
                });

                if (response.ok) {
                    Swal.fire('Berhasil Terkirim! 🚀', 'Data berhasil diperbarui di GitHub. Web kelas sedang di-deploy ulang oleh EdgeOne (biasanya butuh 10-15 detik).', 'success')
                    .then(() => location.reload());
                } else {
                    throw new Error('Gagal melakukan Push. Periksa permission token.');
                }
            } catch (error) {
                Swal.fire('Gagal Push!', error.message, 'error');
            }
        }
    </script>
</body>
</html>
